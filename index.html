<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Notebook</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  :root {
    --bg: #eef1f7;
    --bg-2: #e4e9f2;
    --surface: #ffffff;
    --surface-2: #f4f6fb;
    --border: #e1e5ef;
    --border-strong: #cdd4e3;
    --ink: #1b2030;
    --ink-soft: #5b6478;
    --ink-faint: #8b93a7;
    --accent: #3d6bff;
    --accent-strong: #2b52d6;
    --accent-soft: #e7edff;
    --accent-soft-border: #c3d2ff;
    --folder-fill: #ffc94a;
    --folder-fill-dark: #f2a83a;
    --folder-tile: #fff2d6;
    --note-tile: #e7edff;
    --focus-ring: #3d6bff;
    --shadow-sm: 0 1px 2px rgba(27, 32, 48, 0.05), 0 1px 1px rgba(27, 32, 48, 0.04);
    --shadow: 0 2px 4px rgba(27, 32, 48, 0.04), 0 10px 24px rgba(27, 32, 48, 0.07);
    --shadow-lg: 0 8px 16px rgba(27, 32, 48, 0.08), 0 24px 48px rgba(27, 32, 48, 0.12);
    --radius-sm: 12px;
    --radius: 20px;
    --radius-lg: 28px;
    --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 24px; --sp-6: 32px; --sp-7: 48px;
    color-scheme: light;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14161f;
      --bg-2: #191c27;
      --surface: #1e2130;
      --surface-2: #262a3b;
      --border: #323647;
      --border-strong: #414659;
      --ink: #eef0f6;
      --ink-soft: #b2b8cc;
      --ink-faint: #7d8398;
      --accent: #7d9bff;
      --accent-strong: #a4bbff;
      --accent-soft: #262e4d;
      --accent-soft-border: #3a447a;
      --folder-fill: #ffcf63;
      --folder-fill-dark: #e5ac3e;
      --folder-tile: #3a3320;
      --note-tile: #262e4d;
      --focus-ring: #a4bbff;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
      --shadow: 0 2px 4px rgba(0, 0, 0, 0.25), 0 10px 24px rgba(0, 0, 0, 0.3);
      --shadow-lg: 0 8px 16px rgba(0, 0, 0, 0.35), 0 24px 48px rgba(0, 0, 0, 0.4);
      color-scheme: dark;
    }
  }

  :root[data-theme="dark"] {
    --bg: #14161f;
    --bg-2: #191c27;
    --surface: #1e2130;
    --surface-2: #262a3b;
    --border: #323647;
    --border-strong: #414659;
    --ink: #eef0f6;
    --ink-soft: #b2b8cc;
    --ink-faint: #7d8398;
    --accent: #7d9bff;
    --accent-strong: #a4bbff;
    --accent-soft: #262e4d;
    --accent-soft-border: #3a447a;
    --folder-fill: #ffcf63;
    --folder-fill-dark: #e5ac3e;
    --folder-tile: #3a3320;
    --note-tile: #262e4d;
    --focus-ring: #a4bbff;
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
    --shadow: 0 2px 4px rgba(0, 0, 0, 0.25), 0 10px 24px rgba(0, 0, 0, 0.3);
    --shadow-lg: 0 8px 16px rgba(0, 0, 0, 0.35), 0 24px 48px rgba(0, 0, 0, 0.4);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: linear-gradient(180deg, var(--bg-2), var(--bg) 240px);
    color: var(--ink);
    font-family: "Inter", system-ui, -apple-system, sans-serif;
    font-size: 16px;
    line-height: 1.5;
  }

  a { color: var(--accent-strong); }

  button {
    font-family: inherit;
    font-size: inherit;
    color: inherit;
  }

  :focus-visible {
    outline: 3px solid var(--focus-ring);
    outline-offset: 2px;
    border-radius: 4px;
  }

  .skip-link {
    position: absolute;
    left: -999px;
    top: 0;
    background: var(--accent);
    color: white;
    padding: 0.75em 1.2em;
    z-index: 100;
    border-radius: 0 0 8px 0;
  }
  .skip-link:focus {
    left: 0;
  }

  header.app-header {
    position: sticky;
    top: 0;
    z-index: 20;
    background: color-mix(in srgb, var(--bg) 82%, transparent);
    backdrop-filter: blur(14px) saturate(1.4);
    -webkit-backdrop-filter: blur(14px) saturate(1.4);
    padding: var(--sp-4) var(--sp-4) var(--sp-3);
  }

  .header-inner {
    max-width: 1040px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: var(--sp-3);
  }

  .brand-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--sp-3);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: var(--sp-2);
    font-family: "Manrope", system-ui, sans-serif;
    font-weight: 800;
    font-size: 1.4rem;
    letter-spacing: -0.02em;
    margin: 0;
  }

  .brand-glyph {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    border-radius: 11px;
    background: linear-gradient(155deg, var(--accent), var(--accent-strong));
    color: #fff;
    box-shadow: var(--shadow-sm);
    flex: none;
  }

  .brand-mark { color: var(--accent); }

  .doc-count {
    font-family: "JetBrains Mono", monospace;
    font-size: 0.76rem;
    color: var(--ink-faint);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    background: var(--surface-2);
    padding: 6px 12px;
    border-radius: 999px;
    border: 1px solid var(--border);
  }

  .search-wrap {
    position: relative;
  }

  .search-wrap svg {
    position: absolute;
    left: 18px;
    top: 50%;
    transform: translateY(-50%);
    pointer-events: none;
    color: var(--ink-faint);
  }

  input#search {
    width: 100%;
    min-height: 52px;
    padding: 0 48px 0 50px;
    border-radius: 999px;
    border: 1.5px solid var(--border);
    background: var(--surface);
    color: var(--ink);
    font-size: 1rem;
    box-shadow: var(--shadow-sm);
    transition: box-shadow 0.15s ease, border-color 0.15s ease;
  }

  input#search:focus-visible {
    border-color: var(--accent);
    box-shadow: 0 0 0 4px var(--accent-soft);
    outline: none;
  }

  input#search::placeholder {
    color: var(--ink-faint);
  }

  .clear-search {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    width: 36px;
    height: 36px;
    border: none;
    background: transparent;
    border-radius: 50%;
    display: none;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--ink-soft);
  }
  .clear-search:hover { background: var(--surface-2); }
  .clear-search.visible { display: flex; }

  nav.breadcrumb {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: var(--sp-1);
    font-size: 0.88rem;
    color: var(--ink-soft);
    padding: 0 var(--sp-1);
  }

  nav.breadcrumb ol {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    list-style: none;
    margin: 0;
    padding: 0;
    gap: var(--sp-1);
  }

  nav.breadcrumb li { display: flex; align-items: center; gap: var(--sp-1); }

  nav.breadcrumb li:not(:last-child)::after {
    content: "";
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--border-strong);
    margin: 0 2px;
    flex: none;
  }

  nav.breadcrumb button {
    background: none;
    border: none;
    padding: 7px 12px;
    border-radius: 999px;
    cursor: pointer;
    color: var(--accent-strong);
    font-weight: 600;
  }
  nav.breadcrumb button:hover { background: var(--accent-soft); }

  nav.breadcrumb [aria-current="page"] {
    color: var(--ink);
    font-weight: 700;
    padding: 7px 12px;
    background: var(--surface-2);
    border-radius: 999px;
  }

  main {
    max-width: 1040px;
    margin: 0 auto;
    padding: var(--sp-5) var(--sp-4) var(--sp-7);
  }

  .section-label {
    font-family: "Manrope", sans-serif;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    font-size: 0.74rem;
    font-weight: 700;
    color: var(--ink-faint);
    margin: var(--sp-6) 0 var(--sp-3);
  }
  .section-label:first-child { margin-top: 0; }

  .entry-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: var(--sp-3);
  }

  .entry {
    display: flex;
    align-items: flex-start;
    gap: var(--sp-3);
    width: 100%;
    text-align: left;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: var(--sp-4);
    min-height: 44px;
    cursor: pointer;
    box-shadow: var(--shadow-sm);
    transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
  }
  .entry:hover {
    border-color: var(--border-strong);
    box-shadow: var(--shadow);
    transform: translateY(-2px);
  }
  .entry:active { transform: translateY(0); }

  .entry-icon {
    flex: none;
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 13px;
  }

  .entry-icon.folder { background: var(--folder-tile); }
  .entry-icon.note { background: var(--note-tile); }

  .entry-text { min-width: 0; padding-top: 2px; }

  .entry-title {
    font-family: "Manrope", sans-serif;
    font-weight: 700;
    margin: 0 0 3px;
    overflow-wrap: break-word;
  }

  .entry-meta {
    font-size: 0.82rem;
    color: var(--ink-faint);
    margin: 0;
  }

  .empty-state {
    text-align: center;
    padding: var(--sp-7) var(--sp-5);
    color: var(--ink-soft);
  }

  .empty-state .empty-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 84px;
    height: 84px;
    border-radius: var(--radius);
    background: var(--surface-2);
    color: var(--ink-faint);
    margin-bottom: var(--sp-4);
  }

  .empty-state h2 {
    font-family: "Manrope", sans-serif;
    font-weight: 800;
    font-size: 1.25rem;
    color: var(--ink);
    margin: 0 0 6px;
  }

  .empty-state p { margin: 0; max-width: 42ch; margin-inline: auto; }

  /* search results */
  .result-path {
    font-family: "JetBrains Mono", monospace;
    font-size: 0.75rem;
    color: var(--ink-faint);
    margin: 4px 0 0;
    overflow-wrap: break-word;
  }

  .result-snippet {
    font-size: 0.88rem;
    color: var(--ink-soft);
    margin: 4px 0 0;
  }
  .result-snippet mark {
    background: var(--accent-soft);
    color: var(--ink);
    border-radius: 3px;
    padding: 0 2px;
  }

  /* reading view */
  .reader {
    position: fixed;
    inset: 0;
    background: var(--bg);
    z-index: 30;
    overflow-y: auto;
  }

  .reader-header {
    position: sticky;
    top: 0;
    background: color-mix(in srgb, var(--bg) 85%, transparent);
    backdrop-filter: blur(14px) saturate(1.4);
    -webkit-backdrop-filter: blur(14px) saturate(1.4);
    padding: var(--sp-3) var(--sp-4);
    display: flex;
    align-items: center;
    gap: var(--sp-2);
    z-index: 1;
  }

  .icon-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 44px;
    height: 44px;
    border-radius: 14px;
    border: 1px solid var(--border);
    background: var(--surface);
    box-shadow: var(--shadow-sm);
    cursor: pointer;
    color: var(--ink);
    flex: none;
    transition: background 0.15s ease, transform 0.15s ease;
  }
  .icon-btn:hover { background: var(--surface-2); transform: translateY(-1px); }

  .reader-path {
    font-family: "JetBrains Mono", monospace;
    font-size: 0.78rem;
    color: var(--ink-faint);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    background: var(--surface-2);
    padding: 6px 12px;
    border-radius: 999px;
  }

  .reader-body {
    max-width: 720px;
    margin: 0 auto;
    padding: var(--sp-5) var(--sp-5) 100px;
  }

  .reader-body h1.note-title {
    font-family: "Manrope", sans-serif;
    font-weight: 800;
    font-size: clamp(1.6rem, 4vw, 2.3rem);
    line-height: 1.2;
    letter-spacing: -0.01em;
    text-wrap: balance;
    margin: 0 0 20px;
  }

  .read-aloud-bar {
    position: sticky;
    top: 76px;
    z-index: 1;
    display: flex;
    align-items: center;
    gap: var(--sp-2);
    flex-wrap: wrap;
    margin-bottom: var(--sp-5);
  }

  .read-aloud-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    min-height: 48px;
    padding: 0 22px;
    border-radius: 999px;
    border: 1.5px solid var(--accent-soft-border);
    background: var(--accent-soft);
    color: var(--accent-strong);
    font-weight: 700;
    cursor: pointer;
    box-shadow: var(--shadow-sm);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .read-aloud-btn:hover { transform: translateY(-1px); box-shadow: var(--shadow); }
  .read-aloud-btn.playing {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
  }

  .read-aloud-stop {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    min-height: 48px;
    padding: 0 18px;
    border-radius: 999px;
    border: 1.5px solid var(--border-strong);
    background: var(--surface);
    cursor: pointer;
    box-shadow: var(--shadow-sm);
  }
  .read-aloud-stop:hover { border-color: var(--ink-soft); }

  .note-content {
    font-family: "Inter", sans-serif;
    font-size: 1.1rem;
    line-height: 1.75;
    max-width: 68ch;
  }
  .note-content :is(h1, h2, h3) {
    font-family: "Manrope", sans-serif;
    font-weight: 700;
    line-height: 1.3;
    text-wrap: balance;
    color: var(--ink);
  }
  .note-content p { margin: 0 0 1.1em; }
  .note-content ul, .note-content ol { margin: 0 0 1.1em; padding-left: 1.4em; }
  .note-content li { margin-bottom: 0.4em; }
  .note-content img { border-radius: var(--radius-sm); margin: 1em 0; box-shadow: var(--shadow); }
  .note-content a { color: var(--accent-strong); text-decoration-thickness: 1.5px; }

  .word-highlight {
    background: var(--accent-soft);
    border-radius: 3px;
  }

  .visually-hidden {
    position: absolute;
    width: 1px; height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  @media (min-width: 640px) {
    .brand { font-size: 1.7rem; }
  }
</style>
</head>
<body>

<a href="#main" class="skip-link">Skip to notes</a>

<header class="app-header">
  <div class="header-inner">
    <div class="brand-row">
      <h1 class="brand">
        <span class="brand-glyph" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M6 3.5h9L19 8v12a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-15a1 1 0 0 1 1-1Z" fill="currentColor" opacity="0.9"/><path d="M14 3.5V8a1 1 0 0 0 1 1h4" stroke="#2b52d6" stroke-width="1.6" stroke-linejoin="round"/></svg>
        </span>
        <span><span class="brand-mark">Note</span>book</span>
      </h1>
      <span class="doc-count" id="docCount" aria-live="polite"></span>
    </div>
    <div class="search-wrap" role="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="m20 20-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <label for="search" class="visually-hidden">Search all notes</label>
      <input type="search" id="search" placeholder="Search all notes…" autocomplete="off">
      <button type="button" class="clear-search" id="clearSearch" aria-label="Clear search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <nav class="breadcrumb" id="breadcrumbNav" aria-label="Folder path"></nav>
  </div>
</header>

<main id="main">
  <div id="listing"></div>
</main>

<div id="readerRoot"></div>

<script>
(function () {
  "use strict";

  var state = {
    db: null,
    folders: [],      // {id, name, parentId}
    notes: [],         // {id, title, folderId, contentHtml, createdAt, updatedAt}
    currentFolderId: null,
    searchQuery: "",
    unsubscribers: [],
    speaking: false,
    paused: false
  };

  var listingEl = document.getElementById("listing");
  var breadcrumbEl = document.getElementById("breadcrumbNav");
  var searchInput = document.getElementById("search");
  var clearBtn = document.getElementById("clearSearch");
  var docCountEl = document.getElementById("docCount");
  var readerRoot = document.getElementById("readerRoot");

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function stripTags(html) {
    var div = document.createElement("div");
    div.innerHTML = html || "";
    return (div.textContent || div.innerText || "").replace(/\s+/g, " ").trim();
  }

  function folderPath(folderId) {
    var parts = [];
    var cur = folderId;
    var guard = 0;
    while (cur !== null && cur !== undefined && guard < 64) {
      var f = state.folders.find(function (x) { return x.id === cur; });
      if (!f) break;
      parts.unshift(f);
      cur = f.parentId;
      guard++;
    }
    return parts;
  }

  function folderPathString(folderId) {
    var parts = folderPath(folderId);
    return parts.length ? parts.map(function (f) { return f.name; }).join(" / ") : "Home";
  }

  function childFolders(parentId) {
    return state.folders
      .filter(function (f) { return (f.parentId || null) === (parentId || null); })
      .sort(function (a, b) { return a.name.localeCompare(b.name); });
  }

  function childNotes(folderId) {
    return state.notes
      .filter(function (n) { return (n.folderId || null) === (folderId || null); })
      .sort(function (a, b) { return a.title.localeCompare(b.title); });
  }

  function updateDocCount() {
    var n = state.notes.length, f = state.folders.length;
    if (!n && !f) { docCountEl.textContent = ""; return; }
    docCountEl.textContent = n + (n === 1 ? " note" : " notes") + " · " + f + (f === 1 ? " folder" : " folders");
  }

  function renderBreadcrumb() {
    var parts = folderPath(state.currentFolderId);
    var html = '<ol>';
    html += '<li>' + (parts.length === 0
      ? '<span aria-current="page">Home</span>'
      : '<button type="button" data-nav-folder="">Home</button>') + '</li>';
    parts.forEach(function (f, i) {
      var isLast = i === parts.length - 1;
      html += '<li>' + (isLast
        ? '<span aria-current="page">' + escapeHtml(f.name) + '</span>'
        : '<button type="button" data-nav-folder="' + f.id + '">' + escapeHtml(f.name) + '</button>') + '</li>';
    });
    html += '</ol>';
    breadcrumbEl.innerHTML = html;
    breadcrumbEl.querySelectorAll("button[data-nav-folder]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var id = btn.getAttribute("data-nav-folder");
        navigateTo(id === "" ? null : id);
      });
    });
  }

  function navigateTo(folderId) {
    state.currentFolderId = folderId;
    searchInput.value = "";
    state.searchQuery = "";
    clearBtn.classList.remove("visible");
    render();
    listingEl.focus && listingEl.scrollIntoView({ block: "start" });
  }

  var folderIconSvg = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">' +
    '<path d="M2.5 7.2c0-1.05.85-1.9 1.9-1.9h4.63c.5 0 .99.2 1.34.56l1.06 1.06c.36.36.84.56 1.35.56h6.32c1.05 0 1.9.85 1.9 1.9v8.4c0 1.05-.85 1.9-1.9 1.9H4.4c-1.05 0-1.9-.85-1.9-1.9V7.2Z" fill="var(--folder-fill-dark)"/>' +
    '<path d="M2.5 9.6c0-1.05.85-1.9 1.9-1.9h15.2c1.05 0 1.9.85 1.9 1.9v8c0 1.05-.85 1.9-1.9 1.9H4.4c-1.05 0-1.9-.85-1.9-1.9v-8Z" fill="var(--folder-fill)"/>' +
    '</svg>';
  var noteIconSvg = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">' +
    '<path d="M5.5 3.5A1.5 1.5 0 0 1 7 2h6.17c.4 0 .78.16 1.06.44l3.83 3.83c.28.28.44.66.44 1.06V20.5A1.5 1.5 0 0 1 17 22H7a1.5 1.5 0 0 1-1.5-1.5v-17Z" fill="var(--accent)"/>' +
    '<path d="M13.5 2.3V6a1.5 1.5 0 0 0 1.5 1.5h3.7" fill="var(--accent-strong)" opacity="0.55"/>' +
    '<path d="M8.25 12h7.5M8.25 15h7.5M8.25 9h4" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" opacity="0.92"/>' +
    '</svg>';

  function relTime(ts) {
    if (!ts) return "";
    var d = new Date(ts);
    return d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
  }

  function render() {
    if (state.searchQuery.trim()) {
      renderSearch(state.searchQuery.trim());
    } else {
      renderFolder();
    }
    renderBreadcrumb();
  }

  function renderFolder() {
    var folders = childFolders(state.currentFolderId);
    var notes = childNotes(state.currentFolderId);

    if (state.folders.length === 0 && state.notes.length === 0) {
      listingEl.innerHTML =
        '<div class="empty-state">' +
        '<span class="empty-icon">' + folderIconSvg.replace('width="24" height="24"', 'width="40" height="40"') + '</span>' +
        '<h2>Nothing here yet</h2>' +
        '<p>This notebook is empty. Once notes and folders are added, they will show up here for browsing and search.</p>' +
        '</div>';
      return;
    }

    if (folders.length === 0 && notes.length === 0) {
      listingEl.innerHTML =
        '<div class="empty-state">' +
        '<span class="empty-icon">' + folderIconSvg.replace('width="24" height="24"', 'width="40" height="40"') + '</span>' +
        '<h2>Empty folder</h2>' +
        '<p>No subfolders or notes here.</p>' +
        '</div>';
      return;
    }

    var html = "";
    if (folders.length) {
      html += '<p class="section-label">Folders</p><div class="entry-grid">';
      folders.forEach(function (f) {
        var count = childFolders(f.id).length + childNotes(f.id).length;
        html += '<button type="button" class="entry" data-open-folder="' + f.id + '">' +
          '<span class="entry-icon folder">' + folderIconSvg + '</span>' +
          '<span class="entry-text"><p class="entry-title">' + escapeHtml(f.name) + '</p>' +
          '<p class="entry-meta">' + count + (count === 1 ? " item" : " items") + '</p></span></button>';
      });
      html += '</div>';
    }
    if (notes.length) {
      html += '<p class="section-label">Notes</p><div class="entry-grid">';
      notes.forEach(function (n) {
        html += '<button type="button" class="entry" data-open-note="' + n.id + '">' +
          '<span class="entry-icon note">' + noteIconSvg + '</span>' +
          '<span class="entry-text"><p class="entry-title">' + escapeHtml(n.title || "Untitled") + '</p>' +
          '<p class="entry-meta">' + escapeHtml(relTime(n.updatedAt || n.createdAt)) + '</p></span></button>';
      });
      html += '</div>';
    }
    listingEl.innerHTML = html;

    listingEl.querySelectorAll("[data-open-folder]").forEach(function (btn) {
      btn.addEventListener("click", function () { navigateTo(btn.getAttribute("data-open-folder")); });
    });
    listingEl.querySelectorAll("[data-open-note]").forEach(function (btn) {
      btn.addEventListener("click", function () { openNote(btn.getAttribute("data-open-note")); });
    });
  }

  function highlightSnippet(text, query) {
    var idx = text.toLowerCase().indexOf(query.toLowerCase());
    if (idx === -1) return escapeHtml(text.slice(0, 140));
    var start = Math.max(0, idx - 40);
    var end = Math.min(text.length, idx + query.length + 80);
    var prefix = start > 0 ? "…" : "";
    var suffix = end < text.length ? "…" : "";
    var before = escapeHtml(text.slice(start, idx));
    var match = escapeHtml(text.slice(idx, idx + query.length));
    var after = escapeHtml(text.slice(idx + query.length, end));
    return prefix + before + "<mark>" + match + "</mark>" + after + suffix;
  }

  function renderSearch(query) {
    var q = query.toLowerCase();
    var results = state.notes.filter(function (n) {
      var title = (n.title || "").toLowerCase();
      var body = stripTags(n.contentHtml).toLowerCase();
      return title.indexOf(q) !== -1 || body.indexOf(q) !== -1;
    }).sort(function (a, b) {
      var at = (a.title || "").toLowerCase().indexOf(q) !== -1 ? 0 : 1;
      var bt = (b.title || "").toLowerCase().indexOf(q) !== -1 ? 0 : 1;
      return at - bt;
    });

    if (results.length === 0) {
      listingEl.innerHTML =
        '<div class="empty-state">' +
        '<span class="empty-icon"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.8"/><path d="m20 20-3.5-3.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span>' +
        '<h2>No matches</h2>' +
        '<p>Nothing found for "' + escapeHtml(query) + '". Try a different word.</p>' +
        '</div>';
      return;
    }

    var html = '<p class="section-label">' + results.length + (results.length === 1 ? " result" : " results") + ' for "' + escapeHtml(query) + '"</p><div class="entry-grid">';
    results.forEach(function (n) {
      var body = stripTags(n.contentHtml);
      var titleMatches = (n.title || "").toLowerCase().indexOf(q) !== -1;
      var snippet = titleMatches ? body.slice(0, 140) + (body.length > 140 ? "…" : "") : highlightSnippet(body, query);
      html += '<button type="button" class="entry" data-open-note="' + n.id + '" style="flex-direction:column;">' +
        '<span style="display:flex; align-items:flex-start; gap:12px; width:100%;">' +
        '<span class="entry-icon note">' + noteIconSvg + '</span>' +
        '<span class="entry-text">' +
        '<p class="entry-title">' + escapeHtml(n.title || "Untitled") + '</p>' +
        '<p class="result-path">' + escapeHtml(folderPathString(n.folderId)) + '</p>' +
        (titleMatches ? '' : '<p class="result-snippet">' + snippet + '</p>') +
        '</span></span></button>';
    });
    html += '</div>';
    listingEl.innerHTML = html;
    listingEl.querySelectorAll("[data-open-note]").forEach(function (btn) {
      btn.addEventListener("click", function () { openNote(btn.getAttribute("data-open-note")); });
    });
  }

  // ---- reading view ----

  var speechAvailable = typeof window.speechSynthesis !== "undefined" && typeof window.SpeechSynthesisUtterance !== "undefined";

  function openNote(noteId) {
    var note = state.notes.find(function (n) { return n.id === noteId; });
    if (!note) return;
    renderReader(note);
  }

  function closeReader() {
    stopSpeech();
    readerRoot.innerHTML = "";
    document.body.style.overflow = "";
  }

  function stopSpeech() {
    if (speechAvailable) window.speechSynthesis.cancel();
    state.speaking = false;
    state.paused = false;
  }

  function renderReader(note) {
    document.body.style.overflow = "hidden";
    var path = folderPathString(note.folderId);

    var readAloudControls = speechAvailable
      ? '<div class="read-aloud-bar">' +
        '<button type="button" class="read-aloud-btn" id="readAloudBtn">🔊 Read aloud</button>' +
        '<button type="button" class="read-aloud-stop visually-hidden" id="readAloudStop">⏹ Stop</button>' +
        '</div>'
      : "";

    readerRoot.innerHTML =
      '<div class="reader" role="dialog" aria-modal="true" aria-labelledby="readerTitle">' +
      '<div class="reader-header">' +
      '<button type="button" class="icon-btn" id="closeReaderBtn" aria-label="Close note, back to notebook">' +
      '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15 5 8 12l7 7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
      '</button>' +
      '<span class="reader-path">' + escapeHtml(path) + '</span>' +
      '</div>' +
      '<div class="reader-body">' +
      '<h1 class="note-title" id="readerTitle">' + escapeHtml(note.title || "Untitled") + '</h1>' +
      readAloudControls +
      '<div class="note-content" id="noteContent">' + (note.contentHtml || "") + '</div>' +
      '</div></div>';

    document.getElementById("closeReaderBtn").addEventListener("click", closeReader);

    if (speechAvailable) {
      var btn = document.getElementById("readAloudBtn");
      var stopBtn = document.getElementById("readAloudStop");
      btn.addEventListener("click", function () {
        if (state.speaking && !state.paused) {
          window.speechSynthesis.pause();
          state.paused = true;
          btn.textContent = "🔊 Resume";
          return;
        }
        if (state.speaking && state.paused) {
          window.speechSynthesis.resume();
          state.paused = false;
          btn.textContent = "⏸ Pause";
          return;
        }
        var text = stripTags(document.getElementById("noteContent").innerHTML);
        if (!text) return;
        var utterance = new SpeechSynthesisUtterance(text);
        utterance.onend = function () {
          state.speaking = false;
          state.paused = false;
          btn.textContent = "🔊 Read aloud";
          btn.classList.remove("playing");
          stopBtn.classList.add("visually-hidden");
        };
        utterance.onerror = utterance.onend;
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(utterance);
        state.speaking = true;
        state.paused = false;
        btn.textContent = "⏸ Pause";
        btn.classList.add("playing");
        stopBtn.classList.remove("visually-hidden");
      });
      stopBtn.addEventListener("click", function () {
        stopSpeech();
        btn.textContent = "🔊 Read aloud";
        btn.classList.remove("playing");
        stopBtn.classList.add("visually-hidden");
      });
    }

    readerRoot.querySelector(".reader").focus();
  }

  // ---- search input wiring ----

  var searchDebounce = null;
  searchInput.addEventListener("input", function () {
    clearBtn.classList.toggle("visible", !!searchInput.value);
    clearTimeout(searchDebounce);
    searchDebounce = setTimeout(function () {
      state.searchQuery = searchInput.value;
      render();
    }, 220);
  });
  clearBtn.addEventListener("click", function () {
    searchInput.value = "";
    state.searchQuery = "";
    clearBtn.classList.remove("visible");
    render();
    searchInput.focus();
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && readerRoot.firstElementChild) closeReader();
  });

  // ---- data wiring (static data.json, edited/redeployed by Claude) ----

  async function loadOnce() {
    try {
      var res = await fetch("data.json", { cache: "no-store" });
      var data = await res.json();
      state.folders = data.folders || [];
      state.notes = data.notes || [];
    } catch (e) {
      state.folders = [];
      state.notes = [];
    }
    updateDocCount();
    render();
  }

  function init() {
    render(); // empty-state first paint, before data.json resolves
    loadOnce();
  }

  init();
})();
</script>
</body>
</html>
