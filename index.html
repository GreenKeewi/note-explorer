<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Notebook</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
  :root {
    --bg: #f4f5f1;
    --surface: #ffffff;
    --surface-2: #eaece5;
    --border: #d8dbd0;
    --border-strong: #c2c6b8;
    --ink: #1e2621;
    --ink-soft: #576056;
    --ink-faint: #838c7f;
    --accent: #2b5d63;
    --accent-strong: #1c4348;
    --accent-soft: #dfebe9;
    --accent-soft-border: #bcd6d2;
    --folder: #a8722f;
    --folder-soft: #f3e6d3;
    --focus-ring: #2b5d63;
    --shadow: 0 1px 2px rgba(30, 38, 33, 0.06), 0 4px 14px rgba(30, 38, 33, 0.05);
    --radius: 10px;
    color-scheme: light;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1a1f1c;
      --surface: #222824;
      --surface-2: #2a312c;
      --border: #3a4139;
      --border-strong: #4a5248;
      --ink: #eceee8;
      --ink-soft: #b7bdb1;
      --ink-faint: #838f80;
      --accent: #6fb3ab;
      --accent-strong: #8ecac2;
      --accent-soft: #26403e;
      --accent-soft-border: #345e59;
      --folder: #d9a25c;
      --folder-soft: #3a3120;
      --focus-ring: #8ecac2;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 14px rgba(0, 0, 0, 0.28);
      color-scheme: dark;
    }
  }

  :root[data-theme="dark"] {
    --bg: #1a1f1c;
    --surface: #222824;
    --surface-2: #2a312c;
    --border: #3a4139;
    --border-strong: #4a5248;
    --ink: #eceee8;
    --ink-soft: #b7bdb1;
    --ink-faint: #838f80;
    --accent: #6fb3ab;
    --accent-strong: #8ecac2;
    --accent-soft: #26403e;
    --accent-soft-border: #345e59;
    --folder: #d9a25c;
    --folder-soft: #3a3120;
    --focus-ring: #8ecac2;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 14px rgba(0, 0, 0, 0.28);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
    font-size: 17px;
    line-height: 1.5;
  }

  a { color: var(--accent-strong); }

  button {
    font-family: inherit;
    font-size: inherit;
    color: inherit;
  }

  :focus-visible {
    outline: 3px solid var(--focus-ring);
    outline-offset: 2px;
    border-radius: 4px;
  }

  .skip-link {
    position: absolute;
    left: -999px;
    top: 0;
    background: var(--accent);
    color: white;
    padding: 0.75em 1.2em;
    z-index: 100;
    border-radius: 0 0 8px 0;
  }
  .skip-link:focus {
    left: 0;
  }

  header.app-header {
    position: sticky;
    top: 0;
    z-index: 20;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 14px 16px;
  }

  .header-inner {
    max-width: 980px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .brand-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
  }

  .brand {
    font-family: "Source Serif 4", Georgia, serif;
    font-weight: 600;
    font-size: 1.5rem;
    letter-spacing: -0.01em;
    margin: 0;
  }

  .brand-mark {
    color: var(--accent);
  }

  .doc-count {
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.8rem;
    color: var(--ink-faint);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .search-wrap {
    position: relative;
  }

  .search-wrap svg {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    pointer-events: none;
    color: var(--ink-faint);
  }

  input#search {
    width: 100%;
    min-height: 48px;
    padding: 0 44px 0 44px;
    border-radius: var(--radius);
    border: 1.5px solid var(--border-strong);
    background: var(--surface);
    color: var(--ink);
    font-size: 1rem;
  }

  input#search::placeholder {
    color: var(--ink-faint);
  }

  .clear-search {
    position: absolute;
    right: 6px;
    top: 50%;
    transform: translateY(-50%);
    width: 36px;
    height: 36px;
    border: none;
    background: transparent;
    border-radius: 50%;
    display: none;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--ink-soft);
  }
  .clear-search:hover { background: var(--surface-2); }
  .clear-search.visible { display: flex; }

  nav.breadcrumb {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 2px;
    font-size: 0.92rem;
    color: var(--ink-soft);
  }

  nav.breadcrumb ol {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    list-style: none;
    margin: 0;
    padding: 0;
    gap: 2px;
  }

  nav.breadcrumb li { display: flex; align-items: center; gap: 2px; }

  nav.breadcrumb li:not(:last-child)::after {
    content: "/";
    margin: 0 2px;
    color: var(--ink-faint);
  }

  nav.breadcrumb button {
    background: none;
    border: none;
    padding: 6px 8px;
    border-radius: 6px;
    cursor: pointer;
    color: var(--accent-strong);
    font-weight: 500;
  }
  nav.breadcrumb button:hover { background: var(--surface-2); }

  nav.breadcrumb [aria-current="page"] {
    color: var(--ink);
    font-weight: 600;
    padding: 6px 8px;
  }

  main {
    max-width: 980px;
    margin: 0 auto;
    padding: 20px 16px 64px;
  }

  .section-label {
    font-family: "IBM Plex Mono", monospace;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-size: 0.72rem;
    color: var(--ink-faint);
    margin: 24px 0 10px;
  }
  .section-label:first-child { margin-top: 0; }

  .entry-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 10px;
  }

  .entry {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    width: 100%;
    text-align: left;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
    min-height: 44px;
    cursor: pointer;
    box-shadow: var(--shadow);
  }
  .entry:hover { border-color: var(--border-strong); }
  .entry:active { transform: translateY(1px); }

  .entry-icon {
    flex: none;
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .entry-icon.folder { color: var(--folder); }
  .entry-icon.note { color: var(--accent); }

  .entry-text { min-width: 0; }

  .entry-title {
    font-weight: 600;
    margin: 0 0 2px;
    overflow-wrap: break-word;
  }

  .entry-meta {
    font-size: 0.82rem;
    color: var(--ink-faint);
    margin: 0;
  }

  .empty-state {
    text-align: center;
    padding: 64px 24px;
    color: var(--ink-soft);
  }

  .empty-state svg {
    color: var(--ink-faint);
    margin-bottom: 12px;
  }

  .empty-state h2 {
    font-family: "Source Serif 4", Georgia, serif;
    font-weight: 600;
    font-size: 1.3rem;
    color: var(--ink);
    margin: 0 0 6px;
  }

  .empty-state p { margin: 0; max-width: 42ch; margin-inline: auto; }

  /* search results */
  .result-path {
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.75rem;
    color: var(--ink-faint);
    margin: 4px 0 0;
    overflow-wrap: break-word;
  }

  .result-snippet {
    font-size: 0.88rem;
    color: var(--ink-soft);
    margin: 4px 0 0;
  }
  .result-snippet mark {
    background: var(--accent-soft);
    color: var(--ink);
    border-radius: 3px;
    padding: 0 2px;
  }

  /* reading view */
  .reader {
    position: fixed;
    inset: 0;
    background: var(--bg);
    z-index: 30;
    overflow-y: auto;
  }

  .reader-header {
    position: sticky;
    top: 0;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 8px;
    z-index: 1;
  }

  .icon-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 1px solid transparent;
    background: transparent;
    cursor: pointer;
    color: var(--ink);
    flex: none;
  }
  .icon-btn:hover { background: var(--surface-2); }

  .reader-path {
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.78rem;
    color: var(--ink-faint);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .reader-body {
    max-width: 680px;
    margin: 0 auto;
    padding: 24px 20px 100px;
  }

  .reader-body h1.note-title {
    font-family: "Source Serif 4", Georgia, serif;
    font-weight: 600;
    font-size: clamp(1.6rem, 4vw, 2.3rem);
    line-height: 1.2;
    text-wrap: balance;
    margin: 0 0 20px;
  }

  .read-aloud-bar {
    position: sticky;
    top: 68px;
    z-index: 1;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 24px;
  }

  .read-aloud-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    min-height: 44px;
    padding: 0 18px;
    border-radius: 999px;
    border: 1.5px solid var(--accent-soft-border);
    background: var(--accent-soft);
    color: var(--accent-strong);
    font-weight: 600;
    cursor: pointer;
  }
  .read-aloud-btn:hover { border-color: var(--accent); }
  .read-aloud-btn.playing {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
  }

  .read-aloud-stop {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    min-height: 44px;
    padding: 0 14px;
    border-radius: 999px;
    border: 1.5px solid var(--border-strong);
    background: var(--surface);
    cursor: pointer;
  }
  .read-aloud-stop:hover { border-color: var(--ink-soft); }

  .note-content {
    font-family: "Source Serif 4", Georgia, serif;
    font-size: 1.15rem;
    line-height: 1.7;
    max-width: 65ch;
  }
  .note-content :is(h1, h2, h3) {
    font-family: "IBM Plex Sans", sans-serif;
    font-weight: 600;
    line-height: 1.3;
    text-wrap: balance;
    color: var(--ink);
  }
  .note-content p { margin: 0 0 1.1em; }
  .note-content ul, .note-content ol { margin: 0 0 1.1em; padding-left: 1.4em; }
  .note-content li { margin-bottom: 0.4em; }
  .note-content img { border-radius: 8px; margin: 1em 0; }
  .note-content a { color: var(--accent-strong); text-decoration-thickness: 1.5px; }

  .word-highlight {
    background: var(--accent-soft);
    border-radius: 3px;
  }

  .visually-hidden {
    position: absolute;
    width: 1px; height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  @media (min-width: 640px) {
    .brand { font-size: 1.7rem; }
  }
</style>
</head>
<body>

<a href="#main" class="skip-link">Skip to notes</a>

<header class="app-header">
  <div class="header-inner">
    <div class="brand-row">
      <h1 class="brand"><span class="brand-mark">Note</span>book</h1>
      <span class="doc-count" id="docCount" aria-live="polite"></span>
    </div>
    <div class="search-wrap" role="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="m20 20-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <label for="search" class="visually-hidden">Search all notes</label>
      <input type="search" id="search" placeholder="Search all notes…" autocomplete="off">
      <button type="button" class="clear-search" id="clearSearch" aria-label="Clear search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <nav class="breadcrumb" id="breadcrumbNav" aria-label="Folder path"></nav>
  </div>
</header>

<main id="main">
  <div id="listing"></div>
</main>

<div id="readerRoot"></div>

<script>
(function () {
  "use strict";

  var state = {
    db: null,
    folders: [],      // {id, name, parentId}
    notes: [],         // {id, title, folderId, contentHtml, createdAt, updatedAt}
    currentFolderId: null,
    searchQuery: "",
    unsubscribers: [],
    speaking: false,
    paused: false
  };

  var listingEl = document.getElementById("listing");
  var breadcrumbEl = document.getElementById("breadcrumbNav");
  var searchInput = document.getElementById("search");
  var clearBtn = document.getElementById("clearSearch");
  var docCountEl = document.getElementById("docCount");
  var readerRoot = document.getElementById("readerRoot");

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function stripTags(html) {
    var div = document.createElement("div");
    div.innerHTML = html || "";
    return (div.textContent || div.innerText || "").replace(/\s+/g, " ").trim();
  }

  function folderPath(folderId) {
    var parts = [];
    var cur = folderId;
    var guard = 0;
    while (cur !== null && cur !== undefined && guard < 64) {
      var f = state.folders.find(function (x) { return x.id === cur; });
      if (!f) break;
      parts.unshift(f);
      cur = f.parentId;
      guard++;
    }
    return parts;
  }

  function folderPathString(folderId) {
    var parts = folderPath(folderId);
    return parts.length ? parts.map(function (f) { return f.name; }).join(" / ") : "Home";
  }

  function childFolders(parentId) {
    return state.folders
      .filter(function (f) { return (f.parentId || null) === (parentId || null); })
      .sort(function (a, b) { return a.name.localeCompare(b.name); });
  }

  function childNotes(folderId) {
    return state.notes
      .filter(function (n) { return (n.folderId || null) === (folderId || null); })
      .sort(function (a, b) { return a.title.localeCompare(b.title); });
  }

  function updateDocCount() {
    var n = state.notes.length, f = state.folders.length;
    if (!n && !f) { docCountEl.textContent = ""; return; }
    docCountEl.textContent = n + (n === 1 ? " note" : " notes") + " · " + f + (f === 1 ? " folder" : " folders");
  }

  function renderBreadcrumb() {
    var parts = folderPath(state.currentFolderId);
    var html = '<ol>';
    html += '<li>' + (parts.length === 0
      ? '<span aria-current="page">Home</span>'
      : '<button type="button" data-nav-folder="">Home</button>') + '</li>';
    parts.forEach(function (f, i) {
      var isLast = i === parts.length - 1;
      html += '<li>' + (isLast
        ? '<span aria-current="page">' + escapeHtml(f.name) + '</span>'
        : '<button type="button" data-nav-folder="' + f.id + '">' + escapeHtml(f.name) + '</button>') + '</li>';
    });
    html += '</ol>';
    breadcrumbEl.innerHTML = html;
    breadcrumbEl.querySelectorAll("button[data-nav-folder]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var id = btn.getAttribute("data-nav-folder");
        navigateTo(id === "" ? null : id);
      });
    });
  }

  function navigateTo(folderId) {
    state.currentFolderId = folderId;
    searchInput.value = "";
    state.searchQuery = "";
    clearBtn.classList.remove("visible");
    render();
    listingEl.focus && listingEl.scrollIntoView({ block: "start" });
  }

  var folderIconSvg = '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5h4.379a1.5 1.5 0 0 1 1.06.44l1.122 1.12a1.5 1.5 0 0 0 1.06.44H19.5A1.5 1.5 0 0 1 21 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5v-11Z" fill="currentColor" opacity="0.18" stroke="currentColor" stroke-width="1.6"/></svg>';
  var noteIconSvg = '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 3.5h9L19 8v12a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-15a1 1 0 0 1 1-1Z" fill="currentColor" opacity="0.14" stroke="currentColor" stroke-width="1.6"/><path d="M14 3.5V8a1 1 0 0 0 1 1h4" stroke="currentColor" stroke-width="1.6"/><path d="M8 12.5h8M8 15.5h8M8 9.5h3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>';

  function relTime(ts) {
    if (!ts) return "";
    var d = new Date(ts);
    return d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
  }

  function render() {
    if (state.searchQuery.trim()) {
      renderSearch(state.searchQuery.trim());
    } else {
      renderFolder();
    }
    renderBreadcrumb();
  }

  function renderFolder() {
    var folders = childFolders(state.currentFolderId);
    var notes = childNotes(state.currentFolderId);

    if (state.folders.length === 0 && state.notes.length === 0) {
      listingEl.innerHTML =
        '<div class="empty-state">' +
        '<svg width="52" height="52" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5h4.379a1.5 1.5 0 0 1 1.06.44l1.122 1.12a1.5 1.5 0 0 0 1.06.44H19.5A1.5 1.5 0 0 1 21 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5v-11Z" stroke="currentColor" stroke-width="1.4"/></svg>' +
        '<h2>Nothing here yet</h2>' +
        '<p>This notebook is empty. Once notes and folders are added, they will show up here for browsing and search.</p>' +
        '</div>';
      return;
    }

    if (folders.length === 0 && notes.length === 0) {
      listingEl.innerHTML =
        '<div class="empty-state">' +
        '<svg width="52" height="52" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5h4.379a1.5 1.5 0 0 1 1.06.44l1.122 1.12a1.5 1.5 0 0 0 1.06.44H19.5A1.5 1.5 0 0 1 21 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5v-11Z" stroke="currentColor" stroke-width="1.4"/></svg>' +
        '<h2>Empty folder</h2>' +
        '<p>No subfolders or notes here.</p>' +
        '</div>';
      return;
    }

    var html = "";
    if (folders.length) {
      html += '<p class="section-label">Folders</p><div class="entry-grid">';
      folders.forEach(function (f) {
        var count = childFolders(f.id).length + childNotes(f.id).length;
        html += '<button type="button" class="entry" data-open-folder="' + f.id + '">' +
          '<span class="entry-icon folder">' + folderIconSvg + '</span>' +
          '<span class="entry-text"><p class="entry-title">' + escapeHtml(f.name) + '</p>' +
          '<p class="entry-meta">' + count + (count === 1 ? " item" : " items") + '</p></span></button>';
      });
      html += '</div>';
    }
    if (notes.length) {
      html += '<p class="section-label">Notes</p><div class="entry-grid">';
      notes.forEach(function (n) {
        html += '<button type="button" class="entry" data-open-note="' + n.id + '">' +
          '<span class="entry-icon note">' + noteIconSvg + '</span>' +
          '<span class="entry-text"><p class="entry-title">' + escapeHtml(n.title || "Untitled") + '</p>' +
          '<p class="entry-meta">' + escapeHtml(relTime(n.updatedAt || n.createdAt)) + '</p></span></button>';
      });
      html += '</div>';
    }
    listingEl.innerHTML = html;

    listingEl.querySelectorAll("[data-open-folder]").forEach(function (btn) {
      btn.addEventListener("click", function () { navigateTo(btn.getAttribute("data-open-folder")); });
    });
    listingEl.querySelectorAll("[data-open-note]").forEach(function (btn) {
      btn.addEventListener("click", function () { openNote(btn.getAttribute("data-open-note")); });
    });
  }

  function highlightSnippet(text, query) {
    var idx = text.toLowerCase().indexOf(query.toLowerCase());
    if (idx === -1) return escapeHtml(text.slice(0, 140));
    var start = Math.max(0, idx - 40);
    var end = Math.min(text.length, idx + query.length + 80);
    var prefix = start > 0 ? "…" : "";
    var suffix = end < text.length ? "…" : "";
    var before = escapeHtml(text.slice(start, idx));
    var match = escapeHtml(text.slice(idx, idx + query.length));
    var after = escapeHtml(text.slice(idx + query.length, end));
    return prefix + before + "<mark>" + match + "</mark>" + after + suffix;
  }

  function renderSearch(query) {
    var q = query.toLowerCase();
    var results = state.notes.filter(function (n) {
      var title = (n.title || "").toLowerCase();
      var body = stripTags(n.contentHtml).toLowerCase();
      return title.indexOf(q) !== -1 || body.indexOf(q) !== -1;
    }).sort(function (a, b) {
      var at = (a.title || "").toLowerCase().indexOf(q) !== -1 ? 0 : 1;
      var bt = (b.title || "").toLowerCase().indexOf(q) !== -1 ? 0 : 1;
      return at - bt;
    });

    if (results.length === 0) {
      listingEl.innerHTML =
        '<div class="empty-state">' +
        '<svg width="52" height="52" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.6"/><path d="m20 20-3.5-3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>' +
        '<h2>No matches</h2>' +
        '<p>Nothing found for "' + escapeHtml(query) + '". Try a different word.</p>' +
        '</div>';
      return;
    }

    var html = '<p class="section-label">' + results.length + (results.length === 1 ? " result" : " results") + ' for "' + escapeHtml(query) + '"</p><div class="entry-grid">';
    results.forEach(function (n) {
      var body = stripTags(n.contentHtml);
      var titleMatches = (n.title || "").toLowerCase().indexOf(q) !== -1;
      var snippet = titleMatches ? body.slice(0, 140) + (body.length > 140 ? "…" : "") : highlightSnippet(body, query);
      html += '<button type="button" class="entry" data-open-note="' + n.id + '" style="flex-direction:column;">' +
        '<span style="display:flex; align-items:flex-start; gap:12px; width:100%;">' +
        '<span class="entry-icon note">' + noteIconSvg + '</span>' +
        '<span class="entry-text">' +
        '<p class="entry-title">' + escapeHtml(n.title || "Untitled") + '</p>' +
        '<p class="result-path">' + escapeHtml(folderPathString(n.folderId)) + '</p>' +
        (titleMatches ? '' : '<p class="result-snippet">' + snippet + '</p>') +
        '</span></span></button>';
    });
    html += '</div>';
    listingEl.innerHTML = html;
    listingEl.querySelectorAll("[data-open-note]").forEach(function (btn) {
      btn.addEventListener("click", function () { openNote(btn.getAttribute("data-open-note")); });
    });
  }

  // ---- reading view ----

  var speechAvailable = typeof window.speechSynthesis !== "undefined" && typeof window.SpeechSynthesisUtterance !== "undefined";

  function openNote(noteId) {
    var note = state.notes.find(function (n) { return n.id === noteId; });
    if (!note) return;
    renderReader(note);
  }

  function closeReader() {
    stopSpeech();
    readerRoot.innerHTML = "";
    document.body.style.overflow = "";
  }

  function stopSpeech() {
    if (speechAvailable) window.speechSynthesis.cancel();
    state.speaking = false;
    state.paused = false;
  }

  function renderReader(note) {
    document.body.style.overflow = "hidden";
    var path = folderPathString(note.folderId);

    var readAloudControls = speechAvailable
      ? '<div class="read-aloud-bar">' +
        '<button type="button" class="read-aloud-btn" id="readAloudBtn">🔊 Read aloud</button>' +
        '<button type="button" class="read-aloud-stop visually-hidden" id="readAloudStop">⏹ Stop</button>' +
        '</div>'
      : "";

    readerRoot.innerHTML =
      '<div class="reader" role="dialog" aria-modal="true" aria-labelledby="readerTitle">' +
      '<div class="reader-header">' +
      '<button type="button" class="icon-btn" id="closeReaderBtn" aria-label="Close note, back to notebook">' +
      '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15 5 8 12l7 7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
      '</button>' +
      '<span class="reader-path">' + escapeHtml(path) + '</span>' +
      '</div>' +
      '<div class="reader-body">' +
      '<h1 class="note-title" id="readerTitle">' + escapeHtml(note.title || "Untitled") + '</h1>' +
      readAloudControls +
      '<div class="note-content" id="noteContent">' + (note.contentHtml || "") + '</div>' +
      '</div></div>';

    document.getElementById("closeReaderBtn").addEventListener("click", closeReader);

    if (speechAvailable) {
      var btn = document.getElementById("readAloudBtn");
      var stopBtn = document.getElementById("readAloudStop");
      btn.addEventListener("click", function () {
        if (state.speaking && !state.paused) {
          window.speechSynthesis.pause();
          state.paused = true;
          btn.textContent = "🔊 Resume";
          return;
        }
        if (state.speaking && state.paused) {
          window.speechSynthesis.resume();
          state.paused = false;
          btn.textContent = "⏸ Pause";
          return;
        }
        var text = stripTags(document.getElementById("noteContent").innerHTML);
        if (!text) return;
        var utterance = new SpeechSynthesisUtterance(text);
        utterance.onend = function () {
          state.speaking = false;
          state.paused = false;
          btn.textContent = "🔊 Read aloud";
          btn.classList.remove("playing");
          stopBtn.classList.add("visually-hidden");
        };
        utterance.onerror = utterance.onend;
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(utterance);
        state.speaking = true;
        state.paused = false;
        btn.textContent = "⏸ Pause";
        btn.classList.add("playing");
        stopBtn.classList.remove("visually-hidden");
      });
      stopBtn.addEventListener("click", function () {
        stopSpeech();
        btn.textContent = "🔊 Read aloud";
        btn.classList.remove("playing");
        stopBtn.classList.add("visually-hidden");
      });
    }

    readerRoot.querySelector(".reader").focus();
  }

  // ---- search input wiring ----

  var searchDebounce = null;
  searchInput.addEventListener("input", function () {
    clearBtn.classList.toggle("visible", !!searchInput.value);
    clearTimeout(searchDebounce);
    searchDebounce = setTimeout(function () {
      state.searchQuery = searchInput.value;
      render();
    }, 220);
  });
  clearBtn.addEventListener("click", function () {
    searchInput.value = "";
    state.searchQuery = "";
    clearBtn.classList.remove("visible");
    render();
    searchInput.focus();
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && readerRoot.firstElementChild) closeReader();
  });

  // ---- data wiring (static data.json, edited/redeployed by Claude) ----

  async function loadOnce() {
    try {
      var res = await fetch("data.json", { cache: "no-store" });
      var data = await res.json();
      state.folders = data.folders || [];
      state.notes = data.notes || [];
    } catch (e) {
      state.folders = [];
      state.notes = [];
    }
    updateDocCount();
    render();
  }

  function init() {
    render(); // empty-state first paint, before data.json resolves
    loadOnce();
  }

  init();
})();
</script>
</body>
</html>
